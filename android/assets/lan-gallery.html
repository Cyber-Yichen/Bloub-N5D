<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bloub · 图库</title>
<style>
:root{font-family:"Microsoft YaHei",system-ui,sans-serif;color:#151d28;background:#f4f7fa;--blue:#3976cb}*{box-sizing:border-box}body{margin:0}main{max-width:1120px;margin:auto;padding:32px 24px}header{display:flex;justify-content:space-between;align-items:center;gap:20px}h1{font-size:30px;letter-spacing:-1px;margin:0}header p{color:#667587;font-size:14px}.tools{display:flex;gap:10px;flex-wrap:wrap}button,a{font:inherit;color:var(--blue);background:white;border:1px solid #dce5ec;border-radius:12px;padding:10px 16px;text-decoration:none;cursor:pointer}button:disabled{opacity:.4;cursor:default}button:focus-visible,a:focus-visible{outline:3px solid var(--blue);outline-offset:3px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:28px}.card{background:white;border:1px solid #dce5ec;border-radius:16px;overflow:hidden}.open{display:block;width:100%;padding:0;border:0;border-radius:0;background:#e4eaf0}.picture{position:relative;width:100%;overflow:hidden}.picture img{position:absolute;left:50%;top:50%;object-fit:contain}.caption{padding:12px;font-size:12px;color:#667587;display:flex;justify-content:space-between;gap:8px}.caption a{padding:0;border:0}.pages{display:flex;justify-content:space-between;margin:24px 0}.note{font-size:13px;color:#667587;line-height:1.8}dialog{width:min(1120px,95vw);max-height:95vh;border:0;border-radius:18px;padding:24px;background:#f4f7fa}dialog::backdrop{background:#151d28bb}.viewer-tools{display:flex;align-items:center;gap:12px;margin-bottom:16px}.viewer-tools span{margin-right:auto}.photo-area{overflow:auto;max-height:75vh;background:#e4eaf0}.photo-area .picture{max-width:100%;margin:auto}.photo-area.zoom .picture{width:200%;max-width:none}#error{color:#9c3434}#empty{padding:100px 20px;text-align:center;color:#667587}@media(max-width:850px){.grid{grid-template-columns:repeat(2,1fr)}header{align-items:flex-start;flex-direction:column}}@media(max-width:450px){main{padding:24px 16px}.grid{grid-template-columns:1fr}}
 .camera-tools{padding:20px;margin-top:24px;border:1px solid #dce5ec;border-radius:16px;background:white;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}.camera-tools h2{font-size:22px;margin:0}.camera-tools p{color:#667587;margin:6px 0;font-size:15px}#live-area{width:100%;background:#151d28;border-radius:12px;text-align:center;overflow:hidden}#live-image{display:block;width:100%;max-height:65vh;object-fit:contain}#capture-status{width:100%}#capture{background:#3976cb;color:white}

.presence-panel{margin-top:24px;padding:24px;border:1px solid #dce5ec;border-radius:16px;background:white}.presence-panel header{align-items:center}.presence-panel h2{font-size:23px;margin:0}.presence-panel header>span{color:#667587}.presence-title{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin:20px 0 12px}.presence-title strong{font-size:26px;color:#3976cb}.presence-title span{font-size:15px;color:#667587}.presence-track{height:32px;border-radius:6px;position:relative;overflow:hidden;background:repeating-linear-gradient(135deg,#e7ebf0 0,#e7ebf0 5px,#f4f7fa 5px,#f4f7fa 10px)}.presence-track>span{position:absolute;top:0;height:100%}.presence-track .occupied{background:#3976cb}.presence-track .empty{background:#c0d7c9}.presence-hours{display:flex;justify-content:space-between;font:13px Consolas,monospace;color:#667587;margin-top:8px}.presence-legend{display:flex;flex-wrap:wrap;gap:16px;font-size:13px;margin-top:12px;color:#667587}.presence-legend i{display:inline-block;width:14px;height:10px;border-radius:2px;background:#e7ebf0;margin-right:5px}.presence-legend .occupied{background:#3976cb}.presence-legend .empty{background:#c0d7c9}.presence-week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px;margin-top:24px}.presence-week button{padding:8px 4px;min-width:0;font-size:13px;color:#667587}.presence-week [aria-pressed=true]{border-color:#3976cb;background:#f4f7fa}.presence-week small{font:13px Consolas,monospace;display:block}.presence-week button>div{position:relative;height:88px;border-bottom:1px solid #dce5ec;margin:6px 0}.presence-week i{position:absolute;width:34%;left:33%;bottom:0;background:#3976cb;border-radius:5px 5px 0 0}.detect-toggle{display:flex;align-items:center;gap:8px;padding:10px 4px;color:#3976cb}.detect-toggle input{width:20px;height:20px;accent-color:#3976cb}#detection-summary{font-size:14px;color:#667587}@media(max-width:450px){.presence-panel{padding:16px}.presence-week{gap:4px}.presence-week small{font-size:10px}.presence-week button{font-size:11px}.presence-title strong{font-size:22px}}
</style><script src="/gallery.js?key=__KEY__" defer></script></head>
<body><main><header><div><h1>bloub <small>图库</small></h1><p id="summary">连接设备中…</p></div><div class="tools"><button id="refresh">刷新</button><a id="archive">下载全部 ZIP</a><a id="api" target="_blank" rel="noreferrer">AI 照片列表</a></div></header>
<section class="camera-tools"><div><h2>实时观察</h2><p id="camera-status">连接相机中…</p></div><div class="tools"><button id="start-stream">开启实时画面</button><button id="capture">拍一张</button><button id="stop-stream" disabled>停止实时画面</button><label class="detect-toggle"><input id="show-detections" type="checkbox">检测框</label><span id="detection-summary"></span></div><div id="live-area" hidden><img id="live-image" alt="设备实时画面"></div><p id="capture-status" role="status"></p></section><section class="presence-panel" aria-label="工位时间统计"><header><h2>工位时间</h2><span id="presence-status">连接设备中…</span></header><div class="presence-title"><strong id="presence-total">今日在位 0分钟</strong><span id="presence-first">首次在位 —</span></div><div id="presence-track" class="presence-track" role="img" aria-label="全天座位状态"></div><div class="presence-hours"><span>00</span><span>04</span><span>08</span><span>12</span><span>16</span><span>20</span><span>24</span></div><div class="presence-legend"><span><i class="occupied"></i>有人</span><span><i class="empty"></i>无人</span><span><i></i>未观察 / 待确认</span><span>估算时间</span></div><div id="presence-days" class="presence-week" aria-label="最近七天在位时长"></div></section><p id="error" role="alert"></p><section class="grid" id="grid"></section><div id="empty" hidden>还没有观察照片，请在设备开启相机和“保存观察”。</div><nav class="pages"><button id="newer">较新照片</button><button id="older">较早照片</button></nav></main>
<dialog id="viewer"><div class="viewer-tools"><span id="photo-title"></span><button id="zoom">放大 2×</button><a id="download">下载原图</a><button id="close">返回图库</button></div><div id="photo-area" class="photo-area"></div></dialog></body></html>
