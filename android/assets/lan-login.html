<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bloub · 访问图库</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f1f5f8;color:#161b25;font-family:"Microsoft YaHei",system-ui,sans-serif}main{width:min(420px,90vw);padding:36px;background:white;border:1px solid #dce5ec;border-radius:24px}h1{font:700 38px/1.2 "Arial Rounded MT Bold","Trebuchet MS",sans-serif;letter-spacing:-1px;margin:0 0 30px}label{font-size:18px}input{display:block;margin:12px 0 22px;width:100%;padding:14px;border:1px solid #a8bedc;border-radius:12px;font:30px Consolas,monospace;letter-spacing:8px;text-align:center}button{width:100%;padding:14px;border:0;border-radius:12px;background:#1c59e8;color:white;font-size:18px;cursor:pointer}p{color:#657181;font-size:14px;line-height:1.8}
h1 small{font:16px "Microsoft YaHei",sans-serif;letter-spacing:2px;color:#657181}button:focus-visible,input:focus-visible{outline:3px solid #1c59e8;outline-offset:3px}</style></head><body><main><h1>bloub <small>桌边</small></h1><form method="get" action="/"><label for="code">六位访问码</label><input id="code" name="key" type="password" inputmode="numeric" minlength="6" maxlength="6" pattern="[0-9]{6}" required autofocus autocomplete="off"><button>进入桌边</button></form><p>在设备「图库 → 电脑下载」查看访问码。</p></main></body></html>
